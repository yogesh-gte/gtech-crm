<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - View Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f7ff;
            color: #333;
        }

        .info-section {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            color: #1a8cf0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .info-section p,
        .info-section span {
            color: #4a5568 !important;
        }

        .info-section strong {
            color: #2d3748 !important;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold text-primary">LogSphere</span>
            <div>
                <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4 bg-white">
                    <div
                        class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                        <h3 class="text-dark mb-0 fw-bold">🗣️ Feedback Details</h3>
                        <a th:href="@{/manager/dashboard}" class="btn btn-light border btn-sm">Back</a>
                    </div>
                    <div class="card-body p-4">
                        <div th:object="${feedback}">
                            <div class="info-section shadow-sm">
                                <h5 class="section-title">Employee Information</h5>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <strong>Employee Name:</strong> <span th:text="*{employee.name}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <strong>Employee ID:</strong> <span th:text="*{employee.employeeId}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <strong>Department:</strong> <span th:text="*{employee.department}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <strong>Feedback Date:</strong> <span
                                            th:text="*{#temporals.format(createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="info-section shadow-sm">
                                <h5 class="section-title">Feedback Notes</h5>
                                <p th:text="*{notes}" style="white-space: pre-wrap;"></p>
                            </div>

                            <div class="info-section shadow-sm"
                                th:if="*{improvementSuggestions != null && !improvementSuggestions.isEmpty()}">
                                <h5 class="section-title">Improvement Suggestions</h5>
                                <p th:text="*{improvementSuggestions}" style="white-space: pre-wrap;"></p>
                            </div>

                            <div class="info-section shadow-sm">
                                <h5 class="section-title">Follow-up Information</h5>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <strong>Follow-up Date:</strong>
                                        <span
                                            th:text="*{followUpDate != null ? #temporals.format(followUpDate, 'yyyy-MM-dd HH:mm') : 'Not set'}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <strong>Manager:</strong> <span
                                            th:text="*{manager != null ? manager.name : 'N/A'}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
