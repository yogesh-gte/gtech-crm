<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprints - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
    <!-- Employee Portal Shared Sidebar (when accessed by employee) -->
    <div th:if="${session.employee != null}" th:replace="~{fragments/employee-sidebar :: sidebar(activeTab='sprints')}"></div>

    <div th:class="${session.employee != null} ? 'main-content' : ''">
        <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
            <div class="d-flex align-items-center gap-2">
                <button th:if="${session.employee != null}" class="sidebar-toggle-btn me-2" type="button" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <a class="navbar-brand text-primary fw-bold mb-0" th:href="${session.employee != null} ? @{/employee/dashboard} : @{/}">LogSphere</a>
            </div>
            <div>
                <a th:href="@{/issues}" class="btn btn-outline-secondary btn-sm me-2">Issues</a>
                <a th:href="@{/sprints/add}" class="btn btn-primary btn-sm">Create Sprint</a>
            </div>
        </nav>

    <div class="container py-4">
        <h4 class="mb-4">Sprints</h4>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="get" class="row g-2">
                    <div class="col-md-4">
                        <select name="projectId" class="form-select form-select-sm">
                            <option value="">All Projects</option>
                            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${selectedProjectId != null && selectedProjectId == p.id}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-sm btn-outline-primary col-auto">Filter</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${sprints == null || sprints.isEmpty()}" class="text-center text-muted py-5">No sprints yet. <a th:href="@{/sprints/add}">Create first sprint</a></div>
                <div th:if="${sprints != null && !sprints.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Sprint</th>
                                <th>Project</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Status</th>
                                <th>Issues</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${sprints}">
                                <td th:text="${s.name}">-</td>
                                <td th:text="${s.project != null ? s.project.name : '-'}">-</td>
                                <td th:text="${s.startDate}">-</td>
                                <td th:text="${s.endDate}">-</td>
                                <td>
                                    <span class="badge bg-secondary" th:if="${s.status == 'PLANNING'}">Planning</span>
                                    <span class="badge bg-success" th:if="${s.status == 'ACTIVE'}">Active</span>
                                    <span class="badge bg-dark" th:if="${s.status == 'CLOSED'}">Closed</span>
                                </td>
                                <td th:text="${s.issues != null ? s.issues.size() : 0}">0</td>
                                <td>
                                    <a th:href="@{/sprints/board/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary">Board</a>
                                    <a th:href="@{/sprints/edit/{id}(id=${s.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div> <!-- /main-content -->
</body>
</html>
