<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            background-color: #ffffff;
        }

        .text-primary-custom {
            color: #1a8cf0;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        <div class="card p-4 shadow-sm" style="max-width: 380px; width: 100%;">
            <h3 class="text-center mb-3 fw-bold text-primary-custom">LogSphere</h3>
            <p class="text-center text-muted">Employee Time Log System</p>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email"
                        required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>

            <div class="mt-3 text-center">
                <div class="d-flex justify-content-between">
                    <a th:href="@{/forgot-password}" class="text-muted text-decoration-none small">Forgot Password?</a>
                    <a th:href="@{/}" class="text-muted text-decoration-none small">Back to Home</a>
                </div>
                <div class="mt-3 pt-2 border-top text-center">
                    <p class="text-muted small mb-2">Need to register as admin?</p>
                    <a th:href="@{/register/admin}" class="btn btn-outline-primary btn-sm">Admin Registration</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function () {
            // Check for success message (e.g. registration success, password reset sent)
            var message = /*[[${message}]]*/ null;
            if (message) {
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: message,
                    position: 'center',
                    showConfirmButton: true,
                    confirmButtonText: 'OK',
                    timer: 5000,
                    timerProgressBar: true,
                    backdrop: `
                        rgba(0,0,123,0.4)
                    `
                });
            }

            // Check for error message (e.g. invalid login) - Optional enhancement
            var error = /*[[${error}]]*/ null;
            if (error) {
                // If using the alert div above, we might not need this, but for consistency:
                // Swal.fire({ icon: 'error', title: 'Error', text: error });
            }
        });
        /*]]>*/
    </script>
</body>

</html>
