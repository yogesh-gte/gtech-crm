<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Admin Registration Disabled</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            background-color: #ffffff;
        }

        .text-primary-custom {
            color: #1a8cf0;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        <div class="card p-4 shadow-sm" style="width: 380px;">
            <h3 class="text-center mb-3 fw-bold text-primary-custom">LogSphere</h3>
            <p class="text-center text-muted">Admin Registration</p>

            <!-- Error Message -->
            <div class="alert alert-warning text-center" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <strong>Registration Disabled</strong>
                <p class="mb-0 mt-2">Admin registration is only available for initial setup when no admins exist.</p>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/admin/login}" class="btn btn-primary">Go to Admin Login</a>
            </div>

            <div class="mt-3 text-center">
                <a th:href="@{/}" class="text-muted text-decoration-none small">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>

</html>
