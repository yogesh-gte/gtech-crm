<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Result - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .result-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 35px;
        }
        .success-icon {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .error-icon {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body>
    <div class="result-card">
        <div th:class="${message.contains('successfully') ? 'icon-circle success-icon' : 'icon-circle error-icon'}">
            <i th:class="${message.contains('successfully') ? 'fas fa-check' : 'fas fa-times'}"></i>
        </div>
        
        <h3 class="fw-bold mb-3" th:text="${message.contains('successfully') ? 'Success!' : 'Action Failed'}">Result</h3>
        <p class="text-muted mb-4" th:text="${message}">Message details here.</p>
        
        <a href="/" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Return to Homepage</a>
        <p class="small text-muted mt-3">You can close this window now.</p>
    </div>
</body>
</html>
