<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - View Payroll</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        .info-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            color: #ffc107;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .field-label {
            color: #ffc107;
            font-weight: 600;
        }

        .field-value {
            color: #ffffff;
        }

        .field-value-success {
            color: #28a745;
            font-weight: 500;
        }

        .field-value-danger {
            color: #dc3545;
            font-weight: 500;
        }

        .field-value-warning {
            color: #ffc107;
            font-weight: 500;
        }
    </style>
</head>

<body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-black p-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-warning">LogSphere</span>
            <div>
                <a th:href="@{/hr/dashboard}" class="text-light text-decoration-none me-3">HR Dashboard</a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card bg-black shadow">
                    <div class="card-header bg-dark d-flex justify-content-between align-items-center">
                        <h3 class="text-warning mb-0">💰 Payroll Details</h3>
                        <div>
                            <a th:href="@{/hr/payroll/payslip/{id}(id=${payroll.id})}"
                                class="btn btn-success btn-sm">Generate Payslip</a>
                            <a th:href="@{/hr/dashboard}" class="btn btn-secondary btn-sm">Back</a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div th:object="${payroll}">
                            <!-- Employee & Period -->
                            <div class="info-section">
                                <h4 class="section-title">Employee & Pay Period</h4>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">Employee:</span>
                                        <span class="field-value" th:text="*{employee.name}"></span>
                                        (<span class="field-value" th:text="*{employee.employeeId}"></span>)
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">Pay Period:</span>
                                        <span class="field-value" th:text="*{month} + '/' + *{year}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">Status:</span>
                                        <span class="badge"
                                            th:classappend="${payroll.payrollStatus == T(com.example.demo.model.Payroll.PayrollStatus).PAID ? 'bg-success' : (payroll.payrollStatus == T(com.example.demo.model.Payroll.PayrollStatus).APPROVED ? 'bg-info' : 'bg-warning')}"
                                            th:text="${payroll.payrollStatus}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">Paid On:</span>
                                        <span class="field-value"
                                            th:text="*{paidOn != null ? #dates.format(paidOn, 'yyyy-MM-dd') : 'Not paid'}"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Earnings -->
                            <div class="info-section">
                                <h4 class="section-title">💰 Earnings</h4>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">Gross Salary:</span>
                                        <span class="field-value-success"
                                            th:text="'₹' + *{#numbers.formatDecimal(grossSalary, 0, 2)}"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Deductions -->
                            <div class="info-section">
                                <h4 class="section-title">📉 Deductions</h4>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">LOP Deduction:</span>
                                        <span class="field-value-danger"
                                            th:text="'₹' + *{#numbers.formatDecimal(lopDeduction, 0, 2)}"></span>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <span class="field-label">Total Deductions:</span>
                                        <span class="field-value-danger" style="font-size: 18px; font-weight: bold;"
                                            th:text="'₹' + *{#numbers.formatDecimal(totalDeductions, 0, 2)}"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Net Salary -->
                            <div class="info-section" style="background: #0d0d0d; border: 2px solid #ffc107;">
                                <h4 class="section-title text-warning">💰 Net Salary</h4>
                                <div class="text-center">
                                    <h2 class="text-warning" th:text="'₹' + *{#numbers.formatDecimal(netSalary, 0, 2)}">
                                    </h2>
                                </div>
                            </div>

                            <!-- Net Salary -->
                            <div class="info-section" style="background: #0d0d0d; border: 2px solid #ffc107;">
                                <h4 class="section-title text-warning">💰 Net Salary</h4>
                                <div class="text-center">
                                    <h2 class="text-warning" th:text="'₹' + *{#numbers.formatDecimal(netPay, 0, 2)}">
                                    </h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
