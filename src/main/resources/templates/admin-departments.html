<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f7ff; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
    </style>
</head>

<body>
    <!-- Shared Admin Sidebar Fragment -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('departments')}"></div>

    <div class="main-content">
        <!-- Mobile Header Bar -->
        <div class="mobile-header-bar d-lg-none">
            <button class="sidebar-toggle-btn" type="button" onclick="toggleAdminSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <span class="fw-bold text-primary">Departments</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-primary mb-1"><i class="fas fa-sitemap me-2"></i>Departments</h3>
                <p class="text-secondary small mb-0">Manage organization departments and department codes</p>
            </div>
            <div>
                <a th:href="@{/admin/organization}" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="fas fa-arrow-left me-1"></i> Organization
                </a>
                <a th:href="@{/admin/organization/departments/add}" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus me-1"></i> Add Department
                </a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div th:if="${departments.isEmpty()}" class="text-center text-muted py-5">
                    <i class="fas fa-sitemap fs-3 d-block mb-2 text-secondary"></i>
                    No departments created yet. <a th:href="@{/admin/organization/departments/add}">Add first department</a>
                </div>
                <div th:if="${!departments.isEmpty()}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Name</th>
                                <th>Code</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${departments}">
                                <td class="ps-4 fw-medium" th:text="${d.name}">-</td>
                                <td><span class="badge bg-secondary-subtle text-secondary border" th:text="${d.code != null ? d.code : '-'}">-</span></td>
                                <td th:text="${d.description != null ? d.description : '-'}" class="text-muted small">-</td>
                                <td>
                                    <span class="badge bg-success-subtle text-success" th:if="${d.isActive}">Active</span>
                                    <span class="badge bg-secondary-subtle text-secondary" th:unless="${d.isActive}">Inactive</span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/admin/organization/departments/edit/{id}(id=${d.id})}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                                    <form th:action="@{/admin/organization/departments/delete/{id}(id=${d.id})}" method="post" class="d-inline"
                                          th:if="${d.isActive}" onsubmit="return confirm('Deactivate this department?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Deactivate</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
