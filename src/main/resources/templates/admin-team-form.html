<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/admin/dashboard}">LogSphere</a>
        <a th:href="@{/admin/organization/teams}" class="btn btn-outline-secondary btn-sm">Back to Teams</a>
    </nav>

    <div class="container py-4">
        <h4 class="mb-4" th:text="${team.id != null} ? 'Edit Team' : 'Add Team'">Add Team</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card" style="max-width: 600px;">
            <div class="card-body">
                <form th:action="@{/admin/organization/teams/save}" method="post">
                    <input type="hidden" name="id" th:value="${team.id}">
                    <div class="mb-3">
                        <label class="form-label">Team Name *</label>
                        <input type="text" class="form-control" name="name" th:value="${team.name}" placeholder="e.g., Backend Team" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department *</label>
                        <select class="form-select" name="departmentId" required>
                            <option value="">-- Select Department --</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"
                                    th:selected="${team.department != null && team.department.id == d.id}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Team Lead (TL)</label>
                        <select class="form-select" name="teamLeadId">
                            <option value="">-- None --</option>
                            <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name + ' (' + e.employeeId + ')'}"
                                    th:selected="${team.teamLead != null && team.teamLead.id == e.id}"></option>
                        </select>
                        <small class="text-muted" th:if="${employees == null || employees.isEmpty()}">No employees yet. Add employees via <a th:href="@{/admin/employees}">Employee Registration</a> first.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optional)</label>
                        <textarea class="form-control" name="description" rows="2" th:text="${team.description}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
