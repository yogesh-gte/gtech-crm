<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Visitor Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        .form-label {
            color: #0f1b2d !important;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            display: block;
        }

        .form-control,
        .form-select {
            color: #0f1b2d !important;
            background-color: #ffffff !important;
            border: 1px solid #d9e8f6;
            padding: 10px 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #1a8cf0;
            box-shadow: 0 0 0 0.2rem rgba(26, 140, 240, 0.15);
        }

        .card-compact {
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 8px 22px rgba(15, 27, 45, 0.08);
        }

        .page-wrap {
            min-height: auto;
        }

        .container-narrow {
            max-width: 920px;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <nav class="navbar navbar-light p-3 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">LogSphere</span>
            <div>
                <a th:href="@{/}" class="text-decoration-none nav-link-soft me-3">Home</a>
                <a th:href="@{/visitors/dashboard}" class="text-decoration-none nav-link-soft me-3">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="page-wrap">
        <div class="container container-narrow py-3">
            <div class="row justify-content-center">
                <div class="col-lg-12">
                    <div class="card card-compact">
                        <form th:action="@{/visitors/register}" th:object="${visitor}" method="post">
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}"
                                        placeholder="Full name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}"
                                        placeholder="name@example.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone *</label>
                                    <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                        placeholder="Phone number" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="company" class="form-label">Company *</label>
                                    <input type="text" class="form-control" id="company" th:field="*{company}"
                                        placeholder="Organization" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="personToMeet" class="form-label">Person to Meet</label>
                                    <input type="text" class="form-control" id="personToMeet" th:field="*{personToMeet}"
                                        placeholder="Employee name">
                                </div>
                                <div class="col-md-6">
                                    <label for="purpose" class="form-label">Purpose *</label>
                                    <select class="form-select" id="purpose" th:field="*{purpose}" required>
                                        <option value="">Select</option>
                                        <option value="Meeting">Meeting</option>
                                        <option value="Interview">Interview</option>
                                        <option value="Delivery">Delivery</option>
                                        <option value="Maintenance">Maintenance</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="aadharNumber" class="form-label">Aadhar (12 digits)</label>
                                    <input type="text" class="form-control" id="aadharNumber" th:field="*{aadharNumber}"
                                        placeholder="Optional if PAN given" pattern="[0-9]{12}" maxlength="12">
                                </div>
                                <div class="col-md-6">
                                    <label for="panCardNumber" class="form-label">PAN</label>
                                    <input type="text" class="form-control" id="panCardNumber"
                                        th:field="*{panCardNumber}" placeholder="ABCDE1234F"
                                        pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" maxlength="10"
                                        style="text-transform: uppercase;">
                                </div>
                            </div>

                            <div class="alert alert-info mt-2 mb-2 p-2">
                                <small>Provide at least one ID: Aadhar or PAN.</small>
                            </div>

                            <div class="d-grid gap-2 mt-2">
                                <button type="submit" class="btn btn-warning"
                                    onclick="return validateIdProof()">Register</button>
                                <a th:href="@{/visitors/dashboard}" class="btn btn-outline-secondary">Dashboard</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-uppercase PAN card input
        document.getElementById('panCardNumber')?.addEventListener('input', function (e) {
            this.value = this.value.toUpperCase();
        });

        // Validate that at least one ID proof is provided
        function validateIdProof() {
            const aadharNumber = document.getElementById('aadharNumber')?.value.trim();
            const panCardNumber = document.getElementById('panCardNumber')?.value.trim();

            if ((!aadharNumber || aadharNumber.length === 0) && (!panCardNumber || panCardNumber.length === 0)) {
                alert('Please provide at least one ID proof (Aadhar or PAN Card number).');
                return false;
            }

            // Validate Aadhar format (12 digits)
            if (aadharNumber && aadharNumber.length !== 12) {
                alert('Aadhar number must be exactly 12 digits.');
                return false;
            }

            // Validate PAN format (5 letters, 4 digits, 1 letter)
            if (panCardNumber && !/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(panCardNumber)) {
                alert('PAN card number must be in format: ABCDE1234F (5 letters, 4 digits, 1 letter).');
                return false;
            }

            return true;
        }
    </script>
</body>

</html>
