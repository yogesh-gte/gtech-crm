<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>LogSphere - Time Log</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      background-color: #ffffff;
    }
  </style>
</head>

<body class="bg-light text-dark">
  <div class="container mt-5 text-center">
    <h2 class="text-dark fw-bold mb-4">Employee Time Log</h2>
    <div class="card p-4 shadow-sm" style="max-width: 500px; margin:auto;">
      <h4 class="mb-3 text-dark fw-bold">Today</h4>
      <p class="text-secondary"><strong>Current Status:</strong> Not Checked In</p>
      <button class="btn btn-success w-100 my-2">Check-In</button>
      <button class="btn btn-danger w-100">Check-Out</button>
    </div>
  </div>
</body>

</html>
