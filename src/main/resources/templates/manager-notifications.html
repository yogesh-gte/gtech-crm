<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification History - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f7ff;
            color: #333;
            overflow-x: hidden;
        }

        .notification-card {
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .notification-card:hover {
            background-color: #f8fafc;
        }

        .notification-card.unread {
            border-left-color: #1a8cf0;
            background-color: #f0f7ff;
        }

        .notification-card.read {
            border-left-color: #e2e8f0;
            opacity: 0.9;
        }

        .btn-view-details {
            font-size: 0.875rem;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <!-- Shared Manager Sidebar (LOG-MGR-002, LOG-MGR-004) -->
    <div th:replace="~{fragments/manager-sidebar :: sidebar('notifications')}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <button class="sidebar-toggle-btn me-2" onclick="toggleManagerSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="fw-bold mb-0 text-primary">Notification History</h2>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>

        <!-- LOG-MGR-005: Idle Alert Banner if idle employees exist -->
        <div th:if="${idleCount != null && idleCount > 0}" class="alert alert-danger d-flex justify-content-between align-items-center shadow-sm py-2 px-3 mb-4 rounded-3" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-exclamation-triangle text-danger fs-5"></i>
                <div>
                    <strong>Team Alert:</strong> <span th:text="${idleCount}">1</span> employee(s) currently marked as idle.
                </div>
            </div>
            <button class="btn btn-sm btn-danger py-1 px-3 rounded-pill" data-bs-toggle="modal" data-bs-target="#idleEmployeesModal">
                <i class="fas fa-eye me-1"></i> View Idle List
            </button>
        </div>

        <div class="card shadow-sm border-0 rounded-4 bg-white mb-5">
            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-bell text-primary me-2"></i> All Notifications</h5>
                <span class="badge bg-primary rounded-pill" th:text="${notifications != null ? notifications.size() : 0} + ' total'"></span>
            </div>
            <div class="card-body p-0">
                <div th:if="${notifications == null || notifications.isEmpty()}" class="p-5 text-center text-muted">
                    <div class="mb-3"><i class="far fa-bell" style="font-size: 3rem; opacity: 0.3;"></i></div>
                    <h5>No notifications found</h5>
                    <p>You haven't received any notifications yet.</p>
                </div>

                <div th:if="${notifications != null && !notifications.isEmpty()}" class="list-group list-group-flush">
                    <div th:each="notification : ${notifications}" class="list-group-item p-4 notification-card"
                        th:classappend="${!notification.isRead} ? 'unread' : 'read'">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                            <div class="d-flex align-items-start gap-3">
                                <div class="mt-1">
                                    <i class="fas fa-envelope text-primary" th:if="${!notification.isRead}"></i>
                                    <i class="far fa-envelope-open text-secondary" th:if="${notification.isRead}"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1 fw-bold fs-6 text-dark" th:text="${notification.message}">Notification Message</h5>
                                    <small class="text-muted">
                                        <i class="far fa-clock me-1"></i>
                                        <span
                                            th:text="${#temporals.format(notification.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                                    </small>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <!-- LOG-MGR-008: Specific action buttons based on event type -->
                                <button th:if="${notification.meetingId != null}" 
                                        class="btn btn-outline-primary btn-sm btn-view-details"
                                        th:onclick="'showMeetingDetails(' + ${notification.meetingId} + ')'">
                                    <i class="fas fa-calendar-alt me-1"></i> Meeting Details
                                </button>
                                <a th:if="${notification.meetingId == null && notification.actionUrl != null && notification.actionUrl != '#'}" 
                                   th:href="@{${notification.actionUrl}}" 
                                   class="btn btn-primary btn-sm">
                                    <i class="fas fa-external-link-alt me-1"></i> View Action
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';
        const meetingApiUrl = /*[[@{/manager/api/meetings/}]]*/ '/manager/api/meetings/';

        function showMeetingDetails(meetingId) {
            if (!meetingId) return;

            // Fetch meeting details
            fetch(meetingApiUrl + meetingId)
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Meeting not found');
                })
                .then(meeting => {
                    const startDate = new Date(meeting.startTime);
                    const endDate = meeting.endTime ? new Date(meeting.endTime) : null;

                    const dateStr = startDate.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    const timeStr = startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
                        (endDate ? ' - ' + endDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '');

                    Swal.fire({
                        title: meeting.title,
                        html: `
                            <div class="text-start">
                                <div class="mb-2"><strong>📅 Date:</strong> ${dateStr}</div>
                                <div class="mb-2"><strong>⏰ Time:</strong> ${timeStr}</div>
                                <div class="mb-2"><strong>🏷️ Type:</strong> <span class="badge bg-primary bg-opacity-10 text-primary">${meeting.meetingType || 'Meeting'}</span></div>
                                <div class="mb-2"><strong>📍 Location:</strong> ${meeting.location || 'Online/TBD'}</div>
                                <div class="mt-3 p-2 bg-light rounded border">${meeting.description || 'No description provided.'}</div>
                            </div>
                        `,
                        icon: 'info',
                        confirmButtonText: 'Close',
                        confirmButtonColor: '#1a8cf0'
                    });
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire('Error', 'Could not load meeting details.', 'error');
                });
        }
    </script>
</body>

</html>
