<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Admin Payroll</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-bg: #f3f7ff;
            --sidebar-bg: #e3f2fd;
            --card-bg: #ffffff;
            --text-primary: #0f1b2d;
            --text-secondary: #64748b;
            --accent-blue: #0d6efd;
            --border-color: #dcdfe6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
        }

        /* Sidebar Styling */
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-bg);
            color: var(--text-primary);
            border-right: 1px solid var(--border-color);
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            z-index: 1000;
        }

        .sidebar h3 {
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            padding-left: 10px;
        }

        .sidebar .nav-link {
            color: #4a5568;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 500;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar .nav-link:hover {
            background: rgba(13, 110, 253, 0.08);
            color: var(--accent-blue);
        }

        .sidebar .nav-link.active {
            background: #ffffff;
            color: var(--accent-blue);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 2rem;
        }

        /* Cards */
        .card {
            border: none;
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
        }

        .stat-card.border-success {
            border-left: 4px solid #198754 !important;
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid #f0f0f0;
            padding: 1.25rem;
        }

        .card-header h5 {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
            margin: 0;
        }

        /* Table */
        .table {
            color: var(--text-primary);
            vertical-align: middle;
            margin-bottom: 0;
        }

        .table thead th {
            background-color: #f8f9fa;
            color: #6c757d;
            font-weight: 600;
            border-bottom: 1px solid #dee2e6;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .text-success {
            color: #198754 !important;
        }

        .badge {
            font-weight: 500;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
    </style>
</head>

    <!-- Shared Admin Sidebar Fragment -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('payroll')}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Mobile Header Bar -->
        <div class="mobile-header-bar d-lg-none">
            <button class="sidebar-toggle-btn" type="button" onclick="toggleAdminSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <span class="fw-bold text-primary">Admin Payroll</span>
        </div>

        <!-- Processed Stats Card -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100 border-success">
                    <div class="card-body p-4">
                        <h6 class="text-secondary mb-2" style="font-size: 0.9rem;">Processed</h6>
                        <h2 class="text-success fw-bold mb-0" th:text="${processedCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payroll History Table -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0">Payroll History</h5>
                <button id="addPayrollBtn" class="btn btn-primary btn-sm px-3 fw-medium" data-bs-toggle="modal"
                    data-bs-target="#addPayrollModal">+ Add</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Employee</th>
                                <th>Period</th>
                                <th>Net Salary</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${payrolls.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">No payroll records found</td>
                            </tr>
                            <tr th:each="payroll : ${payrolls}">
                                <td class="ps-4 fw-bold text-dark" th:text="${payroll.employee.name}"></td>
                                <td class="text-secondary">
                                    <span th:text="${#temporals.format(payroll.payPeriodStart, 'MMM d')}"></span> -
                                    <span th:text="${#temporals.format(payroll.payPeriodEnd, 'MMM d')}"></span>
                                </td>
                                <td class="fw-bold text-success"
                                    th:text="${'₹' + #numbers.formatDecimal(payroll.netPay, 0, 0)}"></td>
                                <td>
                                    <span
                                        th:if="${payroll.payrollStatus.name() == 'APPROVED' or payroll.payrollStatus.name() == 'PAID'}"
                                        class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">PROCESSED</span>
                                    <span th:if="${payroll.payrollStatus.name() == 'GENERATED'}"
                                        class="badge bg-light text-dark border px-2 py-1">PENDING</span>
                                    <span
                                        th:if="${payroll.payrollStatus.name() != 'APPROVED' and payroll.payrollStatus.name() != 'PAID' and payroll.payrollStatus.name() != 'GENERATED'}"
                                        class="badge bg-light text-dark border px-2 py-1"
                                        th:text="${payroll.payrollStatus}"></span>
                                </td>
                                <td>
                                    <a href="#" class="btn btn-outline-success btn-sm px-3"
                                        style="border-radius: 4px;">Payslip</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Payroll Modal -->
    <div class="modal fade" id="addPayrollModal" tabindex="-1" aria-labelledby="addPayrollModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addPayrollModalLabel">Add Payroll</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addPayrollForm" onsubmit="return false;">
                        <div class="mb-3">
                            <label for="employeeSearchInput" class="form-label fw-semibold">Employee <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control" id="employeeSearchInput" list="employeeDatalist"
                                       placeholder="Type name or ID to search..." autocomplete="off">
                                <button class="btn btn-outline-secondary" type="button" id="clearEmployeeSearch" title="Clear search">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <datalist id="employeeDatalist"></datalist>
                            <select class="form-select mt-2" id="employeeSelect" required>
                                <option value="" selected disabled>-- Select or search employee above --</option>
                            </select>
                            <div class="form-text text-muted">Type manually to search by name/ID, or select directly from the list.</div>
                        </div>
                        <div class="mb-3">
                            <label for="employeeName" class="form-label">Name</label>
                            <input type="text" class="form-control bg-light" id="employeeName" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="employeeEmail" class="form-label">Email</label>
                            <input type="email" class="form-control bg-light" id="employeeEmail" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="employeeId" class="form-label">Employee ID</label>
                            <input type="text" class="form-control bg-light" id="employeeId" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="baseSalary" class="form-label fw-semibold">Base Salary <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control" id="baseSalary" min="1" step="0.01" placeholder="Enter base salary (e.g. 50000)" required>
                            </div>
                            <div class="form-text text-muted">Base salary must be greater than zero.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="savePayrollBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // Get context path and API endpoints from Thymeleaf
        const contextPath = /*[[@{/}]]*/ '';
        const adminApiEmployeesUrl = /*[[@{/admin/api/employees}]]*/ '/admin/api/employees';
        const adminPayrollSaveUrl = /*[[@{/admin/payroll/save}]]*/ '/admin/payroll/save';
        /*]]>*/
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const employeeSearchInput = document.getElementById('employeeSearchInput');
            const clearEmployeeSearch = document.getElementById('clearEmployeeSearch');
            const employeeDatalist = document.getElementById('employeeDatalist');
            const employeeSelect = document.getElementById('employeeSelect');
            const employeeName = document.getElementById('employeeName');
            const employeeEmail = document.getElementById('employeeEmail');
            const employeeId = document.getElementById('employeeId');
            const savePayrollBtn = document.getElementById('savePayrollBtn');
            const baseSalaryInput = document.getElementById('baseSalary');

            let allEmployeesList = [];

            function populateSelectOptions(employees) {
                employeeSelect.innerHTML = '<option value="" selected disabled>-- Select or search employee above --</option>';
                employees.forEach(emp => {
                    const opt = document.createElement('option');
                    opt.value = emp.id;
                    opt.textContent = emp.name + (emp.employeeId ? ' (' + emp.employeeId + ')' : '');
                    employeeSelect.appendChild(opt);
                });
            }

            // Load employees when modal is opened
            const addPayrollModal = document.getElementById('addPayrollModal');
            addPayrollModal.addEventListener('show.bs.modal', function () {
                fetch(adminApiEmployeesUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        allEmployeesList = data || [];
                        employeeDatalist.innerHTML = '';
                        employeeSelect.innerHTML = '<option value="" selected disabled>-- Select or search employee above --</option>';

                        if (allEmployeesList.length > 0) {
                            allEmployeesList.forEach(emp => {
                                if (emp && emp.id && emp.name) {
                                    // Datalist option
                                    const dlOpt = document.createElement('option');
                                    dlOpt.value = emp.name + (emp.employeeId ? ' (' + emp.employeeId + ')' : '');
                                    dlOpt.setAttribute('data-id', emp.id);
                                    employeeDatalist.appendChild(dlOpt);

                                    // Select option
                                    const selOpt = document.createElement('option');
                                    selOpt.value = emp.id;
                                    selOpt.textContent = emp.name + (emp.employeeId ? ' (' + emp.employeeId + ')' : '');
                                    employeeSelect.appendChild(selOpt);
                                }
                            });
                        } else {
                            const option = document.createElement('option');
                            option.text = 'No employees available';
                            option.disabled = true;
                            employeeSelect.appendChild(option);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching employees:', error);
                        employeeSelect.innerHTML = '<option value="" selected disabled>Error loading employees</option>';
                    });

                // Reset form fields
                document.getElementById('addPayrollForm').reset();
                employeeSearchInput.value = '';
                employeeName.value = '';
                employeeEmail.value = '';
                employeeId.value = '';
                baseSalaryInput.value = '';
            });

            // Search and Manual Typing handler
            employeeSearchInput.addEventListener('input', function () {
                const query = this.value.trim().toLowerCase();
                if (!query) {
                    populateSelectOptions(allEmployeesList);
                    employeeSelect.value = '';
                    employeeSelect.dispatchEvent(new Event('change'));
                    return;
                }

                // Check exact or partial matches
                const matched = allEmployeesList.find(emp => {
                    const full = (emp.name + ' (' + emp.employeeId + ')').toLowerCase();
                    const name = (emp.name || '').toLowerCase();
                    const eid = (emp.employeeId || '').toLowerCase();
                    return full === query || name === query || eid === query;
                });

                if (matched) {
                    populateSelectOptions(allEmployeesList);
                    employeeSelect.value = matched.id;
                    employeeSelect.dispatchEvent(new Event('change'));
                } else {
                    // Filter dropdown options dynamically based on query
                    const filtered = allEmployeesList.filter(emp => {
                        const name = (emp.name || '').toLowerCase();
                        const eid = (emp.employeeId || '').toLowerCase();
                        return name.includes(query) || eid.includes(query);
                    });
                    populateSelectOptions(filtered);
                }
            });

            // Clear search button
            clearEmployeeSearch.addEventListener('click', function () {
                employeeSearchInput.value = '';
                populateSelectOptions(allEmployeesList);
                employeeSelect.value = '';
                employeeSelect.dispatchEvent(new Event('change'));
                employeeSearchInput.focus();
            });

            // Fetch employee details on selection
            employeeSelect.addEventListener('change', function () {
                const empId = this.value;
                if (empId) {
                    const selectedEmp = allEmployeesList.find(e => String(e.id) === String(empId));
                    if (selectedEmp && employeeSearchInput.value !== (selectedEmp.name + ' (' + selectedEmp.employeeId + ')')) {
                        employeeSearchInput.value = selectedEmp.name + (selectedEmp.employeeId ? ' (' + selectedEmp.employeeId + ')' : '');
                    }

                    // Get employee details
                    const employeeApiUrl = contextPath.endsWith('/')
                        ? contextPath + 'admin/api/employees/' + empId
                        : contextPath + '/admin/api/employees/' + empId;
                    fetch(employeeApiUrl)
                        .then(response => response.json())
                        .then(data => {
                            if (data) {
                                employeeName.value = data.name || '';
                                employeeEmail.value = data.email || '';
                                employeeId.value = data.employeeId || '';

                                // Fetch base salary
                                const payrollApiUrl = contextPath.endsWith('/')
                                    ? contextPath + 'admin/api/payroll/base-salary/' + empId
                                    : contextPath + '/admin/api/payroll/base-salary/' + empId;
                                fetch(payrollApiUrl)
                                    .then(response => response.json())
                                    .then(payrollData => {
                                        if (payrollData && payrollData.success && payrollData.baseSalary && payrollData.baseSalary > 0) {
                                            baseSalaryInput.value = payrollData.baseSalary;
                                        } else if (data.salary && data.salary > 0) {
                                            baseSalaryInput.value = data.salary;
                                        } else {
                                            baseSalaryInput.value = '';
                                        }
                                    })
                                    .catch(error => {
                                        console.error('Error fetching payroll data:', error);
                                        if (data.salary && data.salary > 0) {
                                            baseSalaryInput.value = data.salary;
                                        } else {
                                            baseSalaryInput.value = '';
                                        }
                                    });
                            }
                        })
                        .catch(error => console.error('Error fetching employee details:', error));
                } else {
                    // Reset fields
                    employeeName.value = '';
                    employeeEmail.value = '';
                    employeeId.value = '';
                    baseSalaryInput.value = '';
                }
            });

            // Save Payroll with proper field validation
            savePayrollBtn.addEventListener('click', function () {
                const empId = employeeSelect.value;
                const salaryStr = baseSalaryInput.value.trim();
                const salary = parseFloat(salaryStr);

                if (!empId) {
                    alert('Please select or search for an employee.');
                    employeeSearchInput.focus();
                    return;
                }

                if (!salaryStr || isNaN(salary) || salary <= 0) {
                    alert('Please enter a valid base salary greater than 0.');
                    baseSalaryInput.focus();
                    return;
                }

                const params = new URLSearchParams();
                params.append('employeeId', empId);
                params.append('baseSalary', salary);

                fetch(adminPayrollSaveUrl, {
                    method: 'POST',
                    body: params
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Payroll saved successfully!');
                            location.reload();
                        } else {
                            alert('Error: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error saving payroll:', error);
                        alert('An error occurred while saving.');
                    });
            });
        });
    </script>
</body>

</html>
