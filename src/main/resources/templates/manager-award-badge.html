<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Award Badge</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f7ff;
            color: #333;
        }

        .form-section {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            color: #1a8cf0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-label {
            color: #4a5568 !important;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            background-color: #ffffff !important;
            border: 1px solid #dcdfe6;
            color: #0f1b2d !important;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #1a8cf0;
            box-shadow: 0 0 0 0.2rem rgba(26, 140, 240, 0.15);
        }
    </style>
</head>

<body class="bg-light text-dark">
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar p-3" id="sidebar">
        <div class="sidebar-brand">LogSphere</div>
        <ul class="nav flex-column">
            <li class="nav-item mb-2">
                <a class="nav-link" th:href="@{/manager/dashboard(tab='planning')}">
                    <span class="me-2">📊</span> Dashboard Home
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link" th:href="@{/manager/dashboard(tab='feedback')}">
                    <span class="me-2">🗣️</span> Feedback
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link" th:href="@{/manager/dashboard(tab='availability')}">
                    <span class="me-2">📅</span> Availability
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link active" th:href="@{/manager/dashboard(tab='recognition')}">
                    <span class="me-2">🏆</span> Recognition
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link" th:href="@{/manager/dashboard(tab='rules')}">
                    <span class="me-2">🔧</span> Rules
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link" th:href="@{/manager/dashboard(tab='suggestions')}">
                    <span class="me-2">💡</span> Suggestions
                </a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link" th:href="@{/reports}">
                    <span class="me-2">📈</span> Reports
                </a>
            </li>
            <li class="nav-item mt-auto pt-4">
                <a class="nav-link text-danger" th:href="@{/logout}">
                    <span class="me-2">🚪</span> Logout
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <button class="sidebar-toggle-btn me-2" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="fw-bold mb-0 text-primary">Award Badge</h2>
            </div>
            <div>
                <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>

        <div class="container-fluid px-0 pb-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0 rounded-4 bg-white">
                        <div class="card-header bg-white border-bottom py-3">
                            <h3 class="text-dark mb-0 fw-bold">🏆 Award Badge to Employee</h3>
                        </div>
                        <div class="card-body p-4">
                            <!-- Success/Error Messages -->
                            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm"
                                role="alert">
                                <span th:text="${success}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm"
                                role="alert">
                                <span th:text="${error}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <form th:action="@{/manager/badge/award}" method="post">
                                <div class="form-section shadow-sm">
                                    <h5 class="section-title">Badge Details</h5>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="employeeId" class="form-label">Employee <span
                                                    class="text-danger">*</span></label>
                                            <select class="form-select" id="employeeId" name="employeeId" required>
                                                <option value="">Select Employee</option>
                                                <option th:each="emp : ${employees}" th:value="${emp.id}"
                                                    th:text="${emp.name + ' (' + emp.employeeId + ')'}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="badgeName" class="form-label">Badge Name <span
                                                    class="text-danger">*</span></label>
                                            <select class="form-select" id="badgeName" name="badgeName" required>
                                                <option value="">Select Badge</option>
                                                <option value="STAR_PERFORMER">⭐ Star Performer</option>
                                                <option value="TEAM_PLAYER">🤝 Team Player</option>
                                                <option value="INNOVATOR">💡 Innovator</option>
                                                <option value="LEADER">👑 Leader</option>
                                                <option value="DEDICATED">🎯 Dedicated</option>
                                                <option value="EXCELLENCE">🏅 Excellence</option>
                                                <option value="OUTSTANDING">🌟 Outstanding</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="description" class="form-label">Appreciation Note / Description
                                            (Optional)</label>
                                        <textarea class="form-control" id="description" name="description" rows="4"
                                            placeholder="Enter appreciation note or description..."></textarea>
                                    </div>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <a th:href="@{/manager/dashboard}" class="btn btn-light border px-4">Cancel</a>
                                    <button type="submit" class="btn btn-warning text-white px-4 shadow-sm">🏆 Award
                                        Badge</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle Sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.querySelector('.sidebar-overlay').classList.toggle('show');
        }
    </script>
</body>

</html>
