<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/admin/dashboard}">LogSphere</a>
        <div>
            <a th:href="@{/admin/organization}" class="btn btn-outline-secondary btn-sm me-2">Back to Organization</a>
            <a th:href="@{/admin/organization/projects/add}" class="btn btn-info btn-sm">Add Project</a>
        </div>
    </nav>

    <div class="container py-4">
        <h4 class="mb-4">Projects</h4>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}"></div>

        <div class="card">
            <div class="card-body">
                <div th:if="${projects.isEmpty()}" class="text-center text-muted py-5">
                    No projects yet. <a th:href="@{/admin/organization/projects/add}">Add first project</a>
                </div>
                <div th:if="${!projects.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Project</th>
                                <th>Code</th>
                                <th>Team</th>
                                <th>Owner</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${projects}">
                                <td th:text="${p.name}">-</td>
                                <td><span class="badge bg-secondary" th:text="${p.projectCode != null ? p.projectCode : '-'}">-</span></td>
                                <td th:text="${p.team != null ? p.team.name : '-'}">-</td>
                                <td th:text="${p.owner != null ? p.owner.name : '-'}">-</td>
                                <td th:text="${p.startDate != null ? p.startDate : '-'}">-</td>
                                <td th:text="${p.endDate != null ? p.endDate : '-'}">-</td>
                                <td>
                                    <span class="badge bg-success" th:if="${p.status == 'ACTIVE'}">Active</span>
                                    <span class="badge bg-warning" th:if="${p.status == 'ON_HOLD'}">On Hold</span>
                                    <span class="badge bg-secondary" th:if="${p.status == 'COMPLETED'}">Completed</span>
                                    <span class="badge bg-danger" th:if="${p.status == 'CANCELLED'}">Cancelled</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/organization/projects/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <form th:action="@{/admin/organization/projects/delete/{id}(id=${p.id})}" method="post" class="d-inline"
                                          th:if="${p.status == 'ACTIVE'}" onsubmit="return confirm('Cancel this project?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
