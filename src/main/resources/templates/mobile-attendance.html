<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Attendance - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --bg-light: #f8f9fa;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .attendance-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: none;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .emp-avatar {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }
        .card-body {
            padding: 30px 25px;
        }
        .btn-attendance {
            padding: 15px;
            font-weight: 600;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-attendance:active {
            transform: scale(0.98);
        }
        .status-badge {
            font-size: 0.9rem;
            padding: 8px 15px;
            border-radius: 50px;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="attendance-card">
        <div th:if="${error}" class="p-4 text-center">
            <i class="fas fa-exclamation-triangle text-danger fs-1 mb-3"></i>
            <h4 class="fw-bold">Invalid Session</h4>
            <p class="text-muted" th:text="${error}">Error message</p>
            <a href="/" class="btn btn-primary w-100 rounded-pill mt-3">Back to Home</a>
        </div>

        <div th:if="${employee}">
            <div class="card-header-custom">
                <div class="emp-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h4 class="mb-1 fw-bold" th:text="${employee.name}">Employee Name</h4>
                <p class="mb-0 opacity-75 small" th:text="${'ID: ' + employee.employeeId}">EMP001</p>
            </div>

            <div class="card-body text-center">
                <div class="mb-4">
                    <p class="text-muted small mb-1">CURRENT STATUS</p>
                    <span th:if="${isClockedIn}" class="status-badge bg-success-subtle text-success">
                        <i class="fas fa-circle-check me-2"></i>Currently Clocked In
                    </span>
                    <span th:unless="${isClockedIn}" class="status-badge bg-secondary-subtle text-secondary">
                        <i class="fas fa-circle-xmark me-2"></i>Currently Clocked Out
                    </span>
                </div>

                <form th:action="@{/attendance/mobile/action}" method="post">
                    <input type="hidden" name="empId" th:value="${employee.employeeId}">
                    <input type="hidden" name="token" th:value="${token}">
                    
                    <div class="mb-4 text-start">
                        <label class="form-label small fw-bold text-muted">Work Mode</label>
                        <select name="workMode" class="form-select rounded-pill">
                            <option value="OFFICE">Office</option>
                            <option value="REMOTE">Remote</option>
                            <option value="ON-SITE">On-Site</option>
                        </select>
                    </div>

                    <div th:if="${!isClockedIn}">
                        <button type="submit" name="action" value="clock-in" class="btn btn-primary btn-attendance w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Clock In
                        </button>
                    </div>
                    <div th:if="${isClockedIn}">
                        <button type="submit" name="action" value="clock-out" class="btn btn-danger btn-attendance w-100">
                            <i class="fas fa-sign-out-alt me-2"></i>Clock Out
                        </button>
                    </div>
                </form>

                <p class="small text-muted mt-3">
                    <i class="fas fa-location-dot me-1"></i> LogSphere Attendance System
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
