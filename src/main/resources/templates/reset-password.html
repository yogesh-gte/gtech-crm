<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Reset Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            background-color: #ffffff;
        }

        .text-primary-custom {
            color: #1a8cf0;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        <div class="card p-4 shadow-sm" style="width: 380px;">
            <h3 class="text-center mb-3 fw-bold text-primary-custom">LogSphere</h3>
            <p class="text-center text-muted">Set new password</p>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="mb-3">
                    <label for="password" class="form-label text-secondary">New Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter new password" required>
                </div>
                <!-- 
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label text-secondary">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                </div> 
                -->
                <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
