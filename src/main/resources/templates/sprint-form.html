<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/sprints}">LogSphere</a>
        <a th:href="@{/sprints}" class="btn btn-outline-secondary btn-sm">Back to Sprints</a>
    </nav>

    <div class="container py-4">
        <h4 class="mb-4" th:text="${sprint.id != null} ? 'Edit Sprint' : 'Create Sprint'">Create Sprint</h4>

        <div th:if="${error}" class="alert alert-danger" role="alert" style="max-width: 500px;">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success" role="alert" style="max-width: 500px;">
            <span th:text="${success}"></span>
        </div>

        <div class="card" style="max-width: 500px;">
            <div class="card-body">
                <form id="sprintForm" th:action="@{/sprints/save}" method="post">
                    <input type="hidden" name="id" th:value="${sprint.id}">
                    <div class="mb-3">
                        <label class="form-label">Sprint Name *</label>
                        <input type="text" class="form-control" name="name" th:value="${sprint.name}" placeholder="e.g., Sprint 1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Goal (optional)</label>
                        <textarea class="form-control" name="goal" rows="2" th:text="${sprint.goal}" placeholder="Sprint objective or focus"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Project *</label>
                        <select class="form-select" id="projectId" name="projectId" required>
                            <option value="">-- Select Project --</option>
                            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${(sprint.project != null and sprint.project.id == p.id) or (selectedProjectId != null and selectedProjectId == p.id)}"></option>
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Start Date *</label>
                            <input type="date" class="form-control" id="startDate" name="startDateStr" th:value="${sprint.startDate}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">End Date *</label>
                            <input type="date" class="form-control" id="endDate" name="endDateStr" th:value="${sprint.endDate}" required>
                        </div>
                    </div>
                    <div id="dateAlert" class="alert alert-danger d-none py-2 small mb-3"></div>
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save Sprint</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const startInput = document.getElementById('startDate');
        const endInput = document.getElementById('endDate');
        const dateAlert = document.getElementById('dateAlert');
        const form = document.getElementById('sprintForm');

        function validateDates() {
            if (startInput.value && endInput.value) {
                if (endInput.value < startInput.value) {
                    dateAlert.textContent = 'End date cannot be earlier than start date.';
                    dateAlert.classList.remove('d-none');
                    return false;
                } else {
                    dateAlert.classList.add('d-none');
                    return true;
                }
            }
            return true;
        }

        startInput.addEventListener('change', function () {
            endInput.setAttribute('min', this.value);
            validateDates();
        });

        endInput.addEventListener('change', validateDates);

        form.addEventListener('submit', function (e) {
            if (!validateDates()) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
