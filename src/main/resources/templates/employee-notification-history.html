<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification History - LogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-content {
            padding: 20px;
        }

        .notification-read {
            background-color: #f8f9fa;
            opacity: 0.7;
        }

        .notification-unread {
            background-color: #ffffff;
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>

<body>



    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center">
                    <a th:href="@{/employee/dashboard}" class="btn btn-outline-secondary me-3">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                    <h2 class="text-dark fw-bold mb-0">Notification History</h2>
                </div>
                <div>
                    <span class="text-muted small"
                        th:text="${#temporals.format(#temporals.createNow(), 'EEEE, MMMM dd, yyyy')}"></span>
                </div>
            </div>

            <!-- Notifications List -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div th:if="${notifications == null || notifications.isEmpty()}"
                        class="p-4 text-center text-secondary">
                        <i class="far fa-bell-slash fa-3x mb-3"></i>
                        <p>No notifications found.</p>
                    </div>
                    <ul class="list-group list-group-flush"
                        th:if="${notifications != null && !notifications.isEmpty()}">
                        <li th:each="notif : ${notifications}"
                            class="list-group-item p-4 d-flex justify-content-between align-items-start"
                            th:classappend="${notif.isRead} ? 'notification-read' : 'notification-unread'">
                            <div class="d-flex align-items-start">
                                <div class="me-3 mt-1">
                                    <i class="fas fa-envelope text-primary" th:if="${!notif.isRead}"></i>
                                    <i class="far fa-envelope-open text-secondary" th:if="${notif.isRead}"></i>
                                </div>
                                <div th:class="${notif.isRead} ? 'text-muted' : ''">
                                    <h5 class="mb-1 fw-bold"
                                        th:text="${notif.meetingId != null ? 'Meeting Invitation' : 'Notification'}">
                                        Title</h5>
                                    <p class="mb-1" th:text="${notif.message}">Message content</p>
                                    <small
                                        th:text="${#temporals.format(notif.createdAt, 'MMM dd, yyyy HH:mm')}">Date</small>

                                    <div th:if="${notif.meetingId != null}" class="mt-2">
                                        <button class="btn btn-sm btn-outline-primary"
                                            th:onclick="'showMeetingDetails(' + ${notif.meetingId} + ')'">
                                            View Details
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- Future: Add Delete button? -->
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Meeting Details Modal (Copied from Dashboard) -->
    <div class="modal fade" id="meetingDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">📅 Meeting Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h5 id="modalTitle" class="fw-bold mb-3">Meeting Title</h5>
                    <div class="alert alert-light border">
                        <p class="mb-1"><i class="fas fa-align-left me-2 text-secondary"></i> <span id="modalDesc"
                                class="text-dark"></span></p>
                    </div>
                    <ul class="list-unstyled">
                        <li class="mb-2"><i class="far fa-calendar me-2 text-primary"></i> <span id="modalDate"></span>
                        </li>
                        <li class="mb-2"><i class="far fa-clock me-2 text-primary"></i> <span id="modalTime"></span>
                        </li>
                        <li><i class="fas fa-tag me-2 text-primary"></i> <span id="modalType"
                                class="badge bg-secondary">INTERNAL</span></li>
                    </ul>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        // Global context path from Thymeleaf
        const contextPath = /*[[@{/}]]*/ '/';

        function showMeetingDetails(meetingId) {
            if (!meetingId) return;

            // Fetch details
            const url = contextPath + 'employee/api/meetings/' + meetingId;
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Meeting not found');
                })
                .then(meeting => {
                    // Populate Modal
                    document.getElementById('modalTitle').textContent = meeting.title;
                    document.getElementById('modalDesc').textContent = meeting.description || 'No description provided.';

                    const date = new Date(meeting.startTime);
                    document.getElementById('modalDate').textContent = date.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                    let timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                    if (meeting.endTime) {
                        const endDate = new Date(meeting.endTime);
                        timeStr += ' - ' + endDate.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                    }
                    document.getElementById('modalTime').textContent = timeStr;
                    document.getElementById('modalType').textContent = meeting.meetingType || 'MEETING';

                    // Show Modal
                    new bootstrap.Modal(document.getElementById('meetingDetailsModal')).show();
                })
                .catch(err => {
                    console.error('Error fetching meeting:', err);
                    alert('Could not load meeting details.');
                });
        }
    </script>
</body>

</html>
