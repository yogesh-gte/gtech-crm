<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            background-color: #ffffff;
        }

        .text-primary-custom {
            color: #1a8cf0;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        <div class="card p-4 shadow-sm" style="width: 380px;">
            <h3 class="text-center mb-3 fw-bold text-primary-custom">LogSphere</h3>
            <p class="text-center text-muted">Reset your password</p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary">Email Address</label>
                    <div class="input-group">
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email"
                            required>
                        <span class="input-group-text" id="email-status"
                            style="display:none; background-color: #fff;"></span>
                    </div>
                    <div class="form-text">We'll send you a link to reset your password.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Send Reset Link</button>
            </form>

            <div class="mt-3 text-center">
                <a th:href="@{/login}" class="text-muted text-decoration-none small">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function () {
            // Check for success message
            var message = /*[[${message}]]*/ null;
            if (message) {
                Swal.fire({
                    icon: 'success',
                    title: 'Check Your Inbox',
                    text: message,
                    position: 'center',
                    showConfirmButton: true,
                    confirmButtonText: 'Got it!',
                    timer: 5000,
                    timerProgressBar: true,
                    backdrop: `
                        rgba(0,0,123,0.4)
                    `
                });
            }

            const emailInput = document.getElementById('email');
            const statusSpan = document.getElementById('email-status');
            const checkEmailUrl = /*[[@{/api/check-email}]]*/ '/api/check-email';
            let timeout = null;

            emailInput.addEventListener('input', function () {
                const email = emailInput.value;
                if (!email) {
                    statusSpan.style.display = 'none';
                    return;
                }

                // Clear previous timeout
                if (timeout) clearTimeout(timeout);

                // Debounce
                timeout = setTimeout(() => {
                    fetch(checkEmailUrl + '?email=' + encodeURIComponent(email))
                        .then(response => response.json())
                        .then(data => {
                            statusSpan.style.display = 'block';
                            if (data.exists) {
                                statusSpan.innerHTML = '<span class="text-success fw-bold" style="font-size: 1.2rem;">&#10004;</span>'; // Green tick
                                statusSpan.style.borderColor = '#198754';
                            } else {
                                statusSpan.innerHTML = '<span class="text-danger fw-bold" style="font-size: 1.2rem;">&#10006;</span>'; // Red cross
                                statusSpan.style.borderColor = '#dc3545';
                            }
                        })
                        .catch(err => {
                            console.error('Error checking email:', err);
                            statusSpan.style.display = 'none';
                        });
                }, 500); // 500ms delay
            });
        });
        /*]]>*/
    </script>
</body>

</html>
