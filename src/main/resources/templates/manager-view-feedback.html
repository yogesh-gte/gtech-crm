<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - View Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f7ff;
            color: #333;
            overflow-x: hidden;
        }

        .info-section {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            color: #1a8cf0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .info-section p,
        .info-section span {
            color: #4a5568 !important;
        }

        .info-section strong {
            color: #2d3748 !important;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <!-- Shared Manager Sidebar (LOG-MGR-002, LOG-MGR-004) -->
    <div th:replace="~{fragments/manager-sidebar :: sidebar('feedback')}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <button class="sidebar-toggle-btn me-2" onclick="toggleManagerSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="fw-bold mb-0 text-primary">Feedback Record Details</h2>
            </div>
            <div>
                <a th:href="@{/manager/dashboard(tab='feedback')}" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>

        <!-- LOG-MGR-005: Idle Alert Banner if idle employees exist -->
        <div th:if="${idleCount != null && idleCount > 0}" class="alert alert-danger d-flex justify-content-between align-items-center shadow-sm py-2 px-3 mb-4 rounded-3" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-exclamation-triangle text-danger fs-5"></i>
                <div>
                    <strong>Team Alert:</strong> <span th:text="${idleCount}">1</span> employee(s) currently marked as idle.
                </div>
            </div>
            <button class="btn btn-sm btn-danger py-1 px-3 rounded-pill" data-bs-toggle="modal" data-bs-target="#idleEmployeesModal">
                <i class="fas fa-eye me-1"></i> View Idle List
            </button>
        </div>

        <div class="container-fluid px-0 pb-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0 rounded-4 bg-white">
                        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                            <h4 class="text-dark mb-0 fw-bold">🗣️ Feedback Summary</h4>
                            <a th:href="@{/manager/dashboard(tab='feedback')}" class="btn btn-light border btn-sm">Back</a>
                        </div>
                        <div class="card-body p-4">
                            <div th:object="${feedback}">
                                <div class="info-section shadow-sm">
                                    <h5 class="section-title">Employee Information</h5>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <strong>Employee Name:</strong> <span th:text="*{employee.name}"></span>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <strong>Employee ID:</strong> <span th:text="*{employee.employeeId}"></span>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <strong>Department:</strong> <span th:text="*{employee.department}"></span>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <strong>Feedback Date:</strong> <span
                                                th:text="*{#temporals.format(createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                        </div>
                                    </div>
                                </div>

                                <div class="info-section shadow-sm">
                                    <h5 class="section-title">Feedback Notes</h5>
                                    <p th:text="*{notes}" style="white-space: pre-wrap;"></p>
                                </div>

                                <div class="info-section shadow-sm"
                                    th:if="*{improvementSuggestions != null && !improvementSuggestions.isEmpty()}">
                                    <h5 class="section-title">Improvement Suggestions</h5>
                                    <p th:text="*{improvementSuggestions}" style="white-space: pre-wrap;"></p>
                                </div>

                                <div class="info-section shadow-sm">
                                    <h5 class="section-title">Follow-up Information</h5>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <strong>Follow-up Date:</strong>
                                            <span
                                                th:text="*{followUpDate != null ? #temporals.format(followUpDate, 'yyyy-MM-dd HH:mm') : 'Not set'}"></span>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <strong>Manager:</strong> <span
                                                th:text="*{manager != null ? manager.name : 'N/A'}"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
