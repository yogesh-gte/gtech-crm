<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/admin/dashboard}">LogSphere</a>
        <div>
            <a th:href="@{/admin/organization}" class="btn btn-outline-secondary btn-sm me-2">Back to Organization</a>
            <a th:href="@{/admin/organization/teams/add}" class="btn btn-success btn-sm">Add Team</a>
        </div>
    </nav>

    <div class="container py-4">
        <h4 class="mb-4">Teams</h4>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}"></div>

        <div class="card">
            <div class="card-body">
                <div th:if="${teams.isEmpty()}" class="text-center text-muted py-5">
                    No teams yet. Create departments first, then <a th:href="@{/admin/organization/teams/add}">Add team</a>
                </div>
                <div th:if="${!teams.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Team</th>
                                <th>Department</th>
                                <th>Team Lead (TL)</th>
                                <th>Members</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${teams}">
                                <td th:text="${t.name}">-</td>
                                <td th:text="${t.department != null ? t.department.name : '-'}">-</td>
                                <td th:text="${t.teamLead != null ? t.teamLead.name : '-'}">-</td>
                                <td th:text="${t.members != null ? t.members.size() : 0}">0</td>
                                <td>
                                    <span class="badge bg-success" th:if="${t.isActive}">Active</span>
                                    <span class="badge bg-secondary" th:unless="${t.isActive}">Inactive</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/organization/teams/edit/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <form th:action="@{/admin/organization/teams/delete/{id}(id=${t.id})}" method="post" class="d-inline"
                                          th:if="${t.isActive}" onsubmit="return confirm('Deactivate this team?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Deactivate</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
