<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/admin/dashboard}">LogSphere</a>
        <a th:href="@{/admin/organization/departments}" class="btn btn-outline-secondary btn-sm">Back to Departments</a>
    </nav>

    <div class="container py-4">
        <h4 class="mb-4" th:text="${department.id != null} ? 'Edit Department' : 'Add Department'">Add</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card" style="max-width: 500px;">
            <div class="card-body">
                <form th:action="@{/admin/organization/departments/save}" method="post">
                    <input type="hidden" name="id" th:value="${department.id}">
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-control" name="name" th:value="${department.name}" placeholder="e.g., Engineering" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Code (optional)</label>
                        <input type="text" class="form-control" name="code" th:value="${department.code}" placeholder="e.g., ENG, SALES, HR">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optional)</label>
                        <textarea class="form-control" name="description" rows="2" th:text="${department.description}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
