<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Form - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f7ff; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
        .form-label { font-weight: 500; color: #495057; }
    </style>
</head>

<body>
    <!-- Shared Admin Sidebar Fragment -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('departments')}"></div>

    <div class="main-content">
        <!-- Mobile Header Bar -->
        <div class="mobile-header-bar d-lg-none">
            <button class="sidebar-toggle-btn" type="button" onclick="toggleAdminSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <span class="fw-bold text-primary">Departments</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-primary mb-1" th:text="${department.id != null} ? 'Edit Department' : 'Add Department'">Add Department</h3>
                <p class="text-secondary small mb-0">Manage organization department metadata and codes</p>
            </div>
            <div>
                <a th:href="@{/admin/organization/departments}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Back to Departments
                </a>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card" style="max-width: 500px;">
            <div class="card-body p-4">
                <form th:action="@{/admin/organization/departments/save}" method="post">
                    <input type="hidden" name="id" th:value="${department.id}">
                    <div class="mb-3">
                        <label class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" th:value="${department.name}" placeholder="e.g., Engineering" required minlength="2" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Code (optional)</label>
                        <input type="text" class="form-control" name="code" th:value="${department.code}" placeholder="e.g., ENG, SALES, HR" maxlength="10">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description (optional)</label>
                        <textarea class="form-control" name="description" rows="2" th:text="${department.description}" maxlength="500"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Save Department</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
