<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSphere - HR Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            background-color: #ffffff;
        }

        .form-control {
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            border-color: #3b82f6;
            background-color: #ffffff;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        <div class="card p-4 shadow-sm" style="max-width: 380px; width: 100%;">
            <h3 class="text-center mb-3 text-dark fw-bold">LogSphere</h3>
            <p class="text-center text-secondary mb-4">HR Portal Login</p>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0"
                role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/hr/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small fw-bold">Email</label>
                    <input type="email" class="form-control text-dark" id="email" name="email"
                        placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small fw-bold">Password</label>
                    <input type="password" class="form-control text-dark" id="password" name="password"
                        placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2 py-2 fw-medium">HR Login</button>
            </form>

            <div class="mt-4 text-center">
                <a th:href="@{/}" class="text-secondary text-decoration-none small">Back to Home</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
