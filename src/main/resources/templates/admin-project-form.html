<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/admin/dashboard}">LogSphere</a>
        <a th:href="@{/admin/organization/projects}" class="btn btn-outline-secondary btn-sm">Back to Projects</a>
    </nav>

    <div class="container py-4">
        <h4 class="mb-4" th:text="${project.id != null} ? 'Edit Project' : 'Add Project'">Add Project</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card" style="max-width: 600px;">
            <div class="card-body">
                <form th:action="@{/admin/organization/projects/save}" method="post">
                    <input type="hidden" name="id" th:value="${project.id}">
                    <div class="mb-3">
                        <label class="form-label">Project Name *</label>
                        <input type="text" class="form-control" name="name" th:value="${project.name}" placeholder="e.g., Customer Portal" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Project Code (optional)</label>
                        <input type="text" class="form-control" name="projectCode" th:value="${project.projectCode}" placeholder="e.g., PROJ-001">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optional)</label>
                        <textarea class="form-control" name="description" rows="2" th:text="${project.description}"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Team</label>
                            <select class="form-select" name="teamId">
                                <option value="">-- None --</option>
                                <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"
                                        th:selected="${project.team != null && project.team.id == t.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Project Owner</label>
                            <select class="form-select" name="ownerId">
                                <option value="">-- None --</option>
                                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name + ' (' + e.employeeId + ')'}"
                                        th:selected="${project.owner != null && project.owner.id == e.id}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="startDateStr" th:value="${project.startDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control" name="endDateStr" th:value="${project.endDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="ACTIVE" th:selected="${project.status == 'ACTIVE'}">Active</option>
                                <option value="ON_HOLD" th:selected="${project.status == 'ON_HOLD'}">On Hold</option>
                                <option value="COMPLETED" th:selected="${project.status == 'COMPLETED'}">Completed</option>
                                <option value="CANCELLED" th:selected="${project.status == 'CANCELLED'}">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
