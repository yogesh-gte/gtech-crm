<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form - LogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f7ff; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
        .form-label { font-weight: 500; color: #495057; }
    </style>
</head>

<body>
    <!-- Shared Admin Sidebar Fragment -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('projects')}"></div>

    <div class="main-content">
        <!-- Mobile Header Bar -->
        <div class="mobile-header-bar d-lg-none">
            <button class="sidebar-toggle-btn" type="button" onclick="toggleAdminSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <span class="fw-bold text-primary">Projects</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-primary mb-1" th:text="${project.id != null} ? 'Edit Project' : 'Add Project'">Add Project</h3>
                <p class="text-secondary small mb-0">Configure project details, assign teams, and set timeline</p>
            </div>
            <div>
                <a th:href="@{/admin/organization/projects}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Back to Projects
                </a>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card" style="max-width: 700px;">
            <div class="card-body p-4">
                <form th:action="@{/admin/organization/projects/save}" method="post" id="projectForm">
                    <input type="hidden" name="id" th:value="${project.id}">
                    <div class="mb-3">
                        <label class="form-label">Project Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" th:value="${project.name}" placeholder="e.g., Customer Portal" required minlength="2" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Project Code (optional)</label>
                        <input type="text" class="form-control" name="projectCode" th:value="${project.projectCode}" placeholder="e.g., PROJ-001" maxlength="20">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optional)</label>
                        <textarea class="form-control" name="description" rows="2" th:text="${project.description}" maxlength="500"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Team</label>
                            <select class="form-select" name="teamId">
                                <option value="">-- None --</option>
                                <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"
                                        th:selected="${project.team != null && project.team.id == t.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Project Owner</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control" id="projectOwnerSearchInput" list="projectOwnerDatalist"
                                       placeholder="Search or type owner name/ID..." autocomplete="off">
                            </div>
                            <datalist id="projectOwnerDatalist">
                                <option value="-- None --"></option>
                                <option th:each="e : ${employees}" th:value="${e.name + ' (' + e.employeeId + ')'}" th:data-id="${e.id}"></option>
                            </datalist>
                            <select class="form-select mt-2" name="ownerId" id="ownerSelect">
                                <option value="">-- None --</option>
                                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name + ' (' + e.employeeId + ')'}"
                                        th:selected="${project.owner != null && project.owner.id == e.id}"></option>
                            </select>
                            <div class="form-text text-muted">Search by typing name/ID or select from the dropdown.</div>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="startDateStr" id="projectStartDate" th:value="${project.startDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control" name="endDateStr" id="projectEndDate" th:value="${project.endDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="ACTIVE" th:selected="${project.status == 'ACTIVE'}">Active</option>
                                <option value="ON_HOLD" th:selected="${project.status == 'ON_HOLD'}">On Hold</option>
                                <option value="COMPLETED" th:selected="${project.status == 'COMPLETED'}">Completed</option>
                                <option value="CANCELLED" th:selected="${project.status == 'CANCELLED'}">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Save Project</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const projectOwnerSearchInput = document.getElementById('projectOwnerSearchInput');
            const ownerSelect = document.getElementById('ownerSelect');
            const projectStartDate = document.getElementById('projectStartDate');
            const projectEndDate = document.getElementById('projectEndDate');
            const projectForm = document.getElementById('projectForm');

            // Sync current owner into search input
            if (ownerSelect && ownerSelect.value) {
                const selected = ownerSelect.options[ownerSelect.selectedIndex];
                if (selected && selected.value) {
                    projectOwnerSearchInput.value = selected.text;
                }
            }

            // Search and manual input handler
            if (projectOwnerSearchInput && ownerSelect) {
                projectOwnerSearchInput.addEventListener('input', function () {
                    const query = this.value.trim().toLowerCase();
                    if (!query || query === '-- none --') {
                        ownerSelect.value = '';
                        return;
                    }
                    for (let i = 0; i < ownerSelect.options.length; i++) {
                        const opt = ownerSelect.options[i];
                        if (opt.value && (opt.text.toLowerCase().includes(query) || opt.value.toLowerCase() === query)) {
                            ownerSelect.selectedIndex = i;
                            break;
                        }
                    }
                });

                ownerSelect.addEventListener('change', function () {
                    if (this.value) {
                        projectOwnerSearchInput.value = this.options[this.selectedIndex].text;
                    } else {
                        projectOwnerSearchInput.value = '';
                    }
                });
            }

            // Calendar validation
            if (projectStartDate && projectEndDate) {
                if (projectStartDate.value) projectEndDate.min = projectStartDate.value;
                if (projectEndDate.value) projectStartDate.max = projectEndDate.value;

                projectStartDate.addEventListener('change', function () {
                    if (this.value) {
                        projectEndDate.min = this.value;
                        if (projectEndDate.value && projectEndDate.value < this.value) {
                            projectEndDate.value = this.value;
                        }
                    } else {
                        projectEndDate.removeAttribute('min');
                    }
                });

                projectEndDate.addEventListener('change', function () {
                    if (this.value) {
                        projectStartDate.max = this.value;
                        if (projectStartDate.value && projectStartDate.value > this.value) {
                            projectStartDate.value = this.value;
                        }
                    } else {
                        projectStartDate.removeAttribute('max');
                    }
                });
            }

            if (projectForm) {
                projectForm.addEventListener('submit', function (e) {
                    if (projectStartDate && projectEndDate && projectStartDate.value && projectEndDate.value) {
                        if (projectStartDate.value > projectEndDate.value) {
                            e.preventDefault();
                            alert('Start date cannot be after end date.');
                            projectStartDate.focus();
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
