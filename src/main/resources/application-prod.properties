# ==============================================================================
# LogSphere Production Profile (spring.profiles.active=prod)
#
# All production secrets MUST be supplied via environment variables.
# No insecure defaults are permitted. If any required secret is missing,
# the application will fail fast on startup to prevent insecure execution.
# ==============================================================================

spring.application.name=LogSphere

# --- Database Configuration (Strict - Required Environment Variables) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf (Production Caching Enabled) ---
spring.thymeleaf.cache=true
server.port=${PORT:8083}

# --- File Upload Configuration ---
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# --- Mail Configuration (Strict - Required Environment Variables) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM:${MAIL_USERNAME}}

# --- Security & Data Seeding ---
# Never seed demo users with well-known passwords in production
app.security.seed-demo-users=${SEED_DEMO_USERS:false}

# --- HTTP Session & Cookie Security (Production Strict) ---
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=framework

