spring.datasource.url=jdbc:h2:mem:logsphere;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 console for quick inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration (Safe local defaults, configurable via environment variables)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:dev@logsphere.local}
spring.mail.password=${MAIL_PASSWORD:dev_dummy_password}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Security & Demo Data
app.security.seed-demo-users=${SEED_DEMO_USERS:true}

# HTTP Session & Cookie Security
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=framework

